# Ce qui doit tenir avant toute fusion.
#
# Rien ne gardait ce dépôt jusqu'ici, et cela se voyait : `npm run lint`
# échouait sur huit erreurs, `prettier --check` sur trente-quatre fichiers sur
# cinquante-deux, et un gestionnaire d'erreurs à trois paramètres répondait à
# toutes les erreurs en HTML au lieu de JSON sans que personne ne l'ait vu.
# Aucun de ces défauts ne demandait un test astucieux — il leur suffisait de
# quelque chose qui tourne.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      # Le contrat publié doit être celui que les schémas produisent. Un
      # schéma modifié sans régénération laisserait le front sur des types
      # périmés, et rien ne le dirait — ni ici, ni là-bas.
      - run: npm run contract:check

  checks:
    name: Vérifications à l'exécution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Tout ce qui tourne sans base de données, monté sur des applications
      # Express nues : l'arité et le type de contenu du gestionnaire
      # d'erreurs, ce que répond un garde oublié, ce que la validation fait
      # d'une requête, les deux plafonds — quota et taille de corps — et le
      # contrat de sortie.
      - run: npm run verify

      # `verify:copy` et `verify:rounds` exigent mongodb-memory-server, qui
      # télécharge un binaire MongoDB au premier lancement. Délibérément pas
      # branchés ici : ils n'ont jamais tourné du tout — la politique réseau
      # de ce conteneur interdit le téléchargement — et faire dépendre la CI
      # d'une étape que personne n'a jamais vue passer serait livrer une
      # garantie qu'on n'a pas.
